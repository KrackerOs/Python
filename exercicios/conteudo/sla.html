<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Votação Escolar</h1>
        <div id="login-section">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Usuário">
            <input type="password" id="password" placeholder="Senha">
            <button onclick="login()">Entrar</button>
            <p id="login-error" class="error"></p>
        </div>

        <div id="register-section">
            <h2>Registrar</h2>
            <input type="text" id="register-username" placeholder="Novo Usuário">
            <input type="password" id="register-password" placeholder="Nova Senha">
            <button onclick="register()">Registrar</button>
            <p id="register-error" class="error"></p>
        </div>
        
        <div id="voting-section" class="hidden">
            <h2>Bem-vindo, <span id="user-role"></span>!</h2>
            <div id="admin-panel" class="hidden">
                <h3>Administração</h3>
                <p>Usuários que votaram:</p>
                <ul id="voters-list"></ul>
            </div>
            <div id="student-panel">
                <h3>Vote em um evento:</h3>
                <button onclick="vote('Festa Junina')">Festa Junina</button>
                <button onclick="vote('Feira de Ciências')">Feira de Ciências</button>
                <button onclick="vote('Campeonato Esportivo')">Campeonato Esportivo</button>
            </div>
            <div id="results">
                <h3>Resultados:</h3>
                <p>Festa Junina: <span id="votes-festa">0</span>%</p>
                <p>Feira de Ciências: <span id="votes-feira">0</span>%</p>
                <p>Campeonato Esportivo: <span id="votes-campeonato">0</span>%</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
